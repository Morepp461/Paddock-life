name: Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: ["chore/android-build-smoke"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run build
      - name: Generate Android project
        working-directory: app
        run: npx cap add android
      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync android
      - name: Lock orientation to landscape
        run: node tools/lock-landscape.mjs app/android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: paddock-life-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
